apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/JosephItopa/gitops-argocd-project.git
    targetRevision: HEAD
    path: Kubernetes-manifest
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-argocd-ns
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true